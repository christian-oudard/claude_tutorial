[project]
name = "post-opt"
version = "0.1.0"
description = "Axisymmetric post optimizer: max standoff height for a fixed metal mass"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8.0"]

[project.scripts]
post-opt = "post_opt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/post_opt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
